<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Aura Account.">
  <title>Sign Up — Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Ambient Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <a href="index.html" style="text-decoration: none;">
          <div class="logo-group">
            <span class="logo-dot"></span>
            <span class="logo-text">AURA</span>
          </div>
        </a>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join the Orchid Pearl ambient workspace</p>
      </header>

      <form id="signup-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@domain.com">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary">Sign Up</button>

        <div class="divider">or register with</div>

        <div class="social-buttons">
          <div id="google-btn-wrapper" style="width: 100%; display: flex; justify-content: center; height: 40px; overflow: hidden; border-radius: 12px;"></div>
        </div>
      </form>

      <footer class="auth-footer">
        Already have an account? <a href="login.html" class="auth-link">Sign in</a>
      </footer>
    </div>
  </div>

  <!-- Glass Toast Notifications -->
  <div class="auth-toast" id="auth-toast">
    <span class="toast-dot"></span>
    <span id="toast-message">Verification state</span>
  </div>

  <script src="auth.js"></script>
</body>
</html>
