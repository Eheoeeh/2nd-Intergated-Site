<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for Aura.">
  <title>Reset Password — Aura</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <!-- Ambient Orbs -->
  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <header class="auth-header">
        <a href="index.html" style="text-decoration: none;">
          <div class="logo-group">
            <span class="logo-dot"></span>
            <span class="logo-text">AURA</span>
          </div>
        </a>
        <h1 class="auth-title">Define New Password</h1>
        <p class="auth-subtitle">Verify your recovery code below</p>
      </header>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="code">Recovery Code</label>
          <input type="text" id="code" required placeholder="6-digit code" maxlength="6" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="password">New Password</label>
          <input type="password" id="password" required autocomplete="new-password" placeholder="••••••••">
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary">Update Password</button>
      </form>

      <footer class="auth-footer">
        Back to <a href="login.html" class="auth-link">Sign in</a>
      </footer>
    </div>
  </div>

  <!-- Glass Toast Notifications -->
  <div class="auth-toast" id="auth-toast">
    <span class="toast-dot"></span>
    <span id="toast-message">Verification state</span>
  </div>

  <script src="auth.js"></script>
</body>
</html>
